<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frixty Fetcher Download Code Paths</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #111827;
        color: #f9fafb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
      }

      .toolbar {
        position: fixed;
        z-index: 2;
        top: 12px;
        left: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px;
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 8px;
        background: rgb(17 24 39 / 92%);
        box-shadow: 0 12px 32px rgb(0 0 0 / 28%);
      }

      .toolbar strong {
        margin-inline: 4px 8px;
        font-size: 13px;
        font-weight: 650;
        white-space: nowrap;
      }

      button,
      a {
        min-width: 36px;
        height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 6px;
        background: #1f2937;
        color: #f9fafb;
        font: inherit;
        font-size: 13px;
        text-decoration: none;
        cursor: pointer;
      }

      button:hover,
      a:hover {
        background: #374151;
      }

      #zoom {
        min-width: 54px;
        font-variant-numeric: tabular-nums;
        color: #d1d5db;
      }

      .stage {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background:
          linear-gradient(90deg, rgb(255 255 255 / 5%) 1px, transparent 1px),
          linear-gradient(rgb(255 255 255 / 5%) 1px, transparent 1px), #111827;
        background-size: 24px 24px;
        cursor: grab;
      }

      .stage.dragging {
        cursor: grabbing;
      }

      #graph {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="toolbar" aria-label="Graph controls">
      <strong>Download code paths</strong>
      <button type="button" id="zoom-out" title="Zoom out">-</button>
      <span id="zoom">100%</span>
      <button type="button" id="zoom-in" title="Zoom in">+</button>
      <button type="button" id="reset" title="Reset view">Reset</button>
      <a href="download-code-paths.d2" title="Open D2 source">D2</a>
      <a href="download-code-paths-compact.svg" title="Open compact SVG">Compact SVG</a>
      <a href="download-code-paths.svg" title="Open full-size SVG">Full SVG</a>
    </div>
    <main class="stage" id="stage">
      <canvas id="graph" aria-label="Frixty Fetcher download code paths"></canvas>
    </main>
    <script>
      const stage = document.getElementById("stage");
      const canvas = document.getElementById("graph");
      const ctx = canvas.getContext("2d");
      const zoomLabel = document.getElementById("zoom");
      const image = new Image();
      let scale = 1;
      let x = 32;
      let y = 72;
      let dragging = false;
      let lastX = 0;
      let lastY = 0;

      function resizeCanvas() {
        const ratio = window.devicePixelRatio || 1;
        canvas.width = Math.floor(stage.clientWidth * ratio);
        canvas.height = Math.floor(stage.clientHeight * ratio);
        canvas.style.width = `${stage.clientWidth}px`;
        canvas.style.height = `${stage.clientHeight}px`;
        render();
      }

      function render() {
        const ratio = window.devicePixelRatio || 1;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.setTransform(scale * ratio, 0, 0, scale * ratio, x * ratio, y * ratio);
        if (image.complete && image.naturalWidth > 0) {
          ctx.drawImage(image, 0, 0);
        }
        zoomLabel.textContent = `${Math.round(scale * 100)}%`;
      }

      function zoomAt(
        nextScale,
        clientX = stage.clientWidth / 2,
        clientY = stage.clientHeight / 2,
      ) {
        const clamped = Math.min(4, Math.max(0.2, nextScale));
        const localX = (clientX - x) / scale;
        const localY = (clientY - y) / scale;
        scale = clamped;
        x = clientX - localX * scale;
        y = clientY - localY * scale;
        render();
      }

      document.getElementById("zoom-in").addEventListener("click", () => zoomAt(scale * 1.2));
      document.getElementById("zoom-out").addEventListener("click", () => zoomAt(scale / 1.2));
      document.getElementById("reset").addEventListener("click", () => {
        scale = 1;
        x = 32;
        y = 72;
        render();
      });

      stage.addEventListener(
        "wheel",
        (event) => {
          event.preventDefault();
          zoomAt(scale * (event.deltaY < 0 ? 1.12 : 1 / 1.12), event.clientX, event.clientY);
        },
        { passive: false },
      );

      stage.addEventListener("pointerdown", (event) => {
        dragging = true;
        lastX = event.clientX;
        lastY = event.clientY;
        stage.classList.add("dragging");
        stage.setPointerCapture(event.pointerId);
      });

      stage.addEventListener("pointermove", (event) => {
        if (!dragging) return;
        x += event.clientX - lastX;
        y += event.clientY - lastY;
        lastX = event.clientX;
        lastY = event.clientY;
        render();
      });

      stage.addEventListener("pointerup", (event) => {
        dragging = false;
        stage.classList.remove("dragging");
        stage.releasePointerCapture(event.pointerId);
      });

      window.addEventListener("resize", resizeCanvas);
      image.addEventListener("load", resizeCanvas);
      image.src = "download-code-paths-compact.svg";
      resizeCanvas();
    </script>
  </body>
</html>
